// ============ 1RM ============
function estimateOneRm(weight, reps) {
  if (reps <= 0 || weight <= 0) return 0;
  if (reps === 1) return weight;
  const formulas = [
    weight * (1 + reps / 30),
    (weight * 36) / (37 - reps),
    weight * Math.pow(reps, 0.1),
    (100 * weight) / (52.2 + 41.9 * Math.exp(-0.055 * reps)),
    weight * (1 + 0.025 * reps),
  ];
  return formulas.reduce((a, b) => a + b, 0) / formulas.length;
}
function workingWeight(oneRm, pct) {
  return Math.round((oneRm * pct) / 2.5) * 2.5;
}

function PlansPage() {
  const [cfg, setCfg] = useState({ squat: 140, bench: 100, deadlift: 180, ohp: 60 });
  const [weeks, setWeeks] = useState(4);
  const [generated, setGenerated] = useState(null);

  const generate = () => {
    const tm = cfg;
    const SCHEMES = [
      [{ r: 5, p: 0.65 }, { r: 5, p: 0.75 }, { r: 5, p: 0.85, amrap: true }],
      [{ r: 5, p: 0.7 }, { r: 3, p: 0.8 }, { r: 3, p: 0.9, amrap: true }],
      [{ r: 5, p: 0.75 }, { r: 3, p: 0.85 }, { r: 1, p: 0.95, amrap: true }],
      [{ r: 5, p: 0.4 }, { r: 5, p: 0.5 }, { r: 5, p: 0.6 }],
    ];
    const SCHED = { 1: ['深蹲', '卧推'], 2: ['硬拉', '推举'], 3: ['深蹲', '卧推'], 4: ['硬拉', '推举'] };
    const TM_MAP = { '深蹲': tm.squat, '卧推': tm.bench, '硬拉': tm.deadlift, '推举': tm.ohp };
    const out = [];
    for (let w = 1; w <= weeks; w++) {
      const sch = SCHEMES[(w - 1) % 4];
      for (let d = 1; d <= 4; d++) {
        for (const lift of SCHED[d]) {
          const t = TM_MAP[lift];
          sch.forEach((s, i) => {
            out.push({ w, d, lift, set: i + 1, reps: s.r, weight: workingWeight(t, s.p), pct: s.p, amrap: s.amrap });
          });
        }
      }
    }
    setGenerated(out);
  };

  return h('div', { style: { padding: '24px 32px', maxWidth: 1100, margin: '0 auto' }, className: 'page-content' },
    h('div', { style: { marginBottom: 24 } },
      h('h1', { style: { fontSize: 24, fontWeight: 600, margin: 0, letterSpacing: -0.5 } }, '训练计划'),

        return h(Card, { key: name, padding: 16 },
          h('div', { style: { fontSize: 11, color: T.textMuted, display: 'flex', alignItems: 'center', gap: 6 } },

            style: {

          }, name)
        )
      )
    ),

    // 图表
    h(Card, { padding: 20 },
      h(ResponsiveContainer, { width: '100%', height: 360 },
        h(LineChart, { data: PROGRESS, margin: { top: 10, right: 10, left: 0, bottom: 0 } },
          h(CartesianGrid, { strokeDasharray: '3 3', stroke: T.border, vertical: false }),
          h(XAxis, { dataKey: 'date', stroke: T.textDim, fontSize: 11, tickLine: false, axisLine: { stroke: T.border } }),
          h(YAxis, { stroke: T.textDim, fontSize: 11, tickLine: false, axisLine: false, unit: 'kg' }),
          h(Tooltip, {
            contentStyle: { background: T.bgCard, border: `1px solid ${T.border}`, borderRadius: 6, fontSize: 12 },
            labelStyle: { color: T.text, fontWeight: 600 },
            itemStyle: { color: T.textMuted, fontFamily: 'JetBrains Mono, monospace', fontSize: 11 },

          h(Legend, { wrapperStyle: { fontSize: 12, color: T.textMuted } }),
          ...selected.map(name =>
            h(Line, {

      } },
        h(Input, {
          placeholder: '问点什么...', value: input,
          onChange: e => setInput(e.target.value),
          onKeyDown: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } },
          disabled: loading,
          style: { border: 'none', background: 'transparent', boxShadow: 'none', flex: 1 }
        }),
        h(Button, { onClick: send, disabled: loading || !input.trim(), size: 'icon' },
          h(Lucide.ArrowUp, { size: 16 })
        )
      )
    )
  );
}

// ============ Page: Settings (重写) ============
function SettingsPage() {
  const [baseUrl, setBaseUrl] = useState('https://api.openai.com/v1');
  const [apiKey, setApiKey] = useState('');
  const [model, setModel] = useState('gpt-4o-mini');
  const [exCount, setExCount] = useState(0);
  const [testResult, setTestResult] = useState(null);

  return h('div', { style: { padding: '24px 32px', maxWidth: 800, margin: '0 auto' }, className: 'page-content' },
    h('h1', { style: { fontSize: 24, fontWeight: 600, margin: 0, letterSpacing: -0.5, marginBottom: 24 } }, '设置'),

    h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
      // AI API
      h(Card, { padding: 0 },
        h('div', { style: { padding: '16px 20px', borderBottom: `1px solid ${T.border}` } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
            h('div', { style: {
              width: 32, height: 32, borderRadius: 8,
              background: `${T.primary}15`, color: T.primary,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            } }, h(Lucide.Key, { size: 16 })),
            h('div', null,
              h('div', { style: { fontSize: 14, fontWeight: 600 } }, 'AI API'),
              h('div', { style: { fontSize: 11, color: T.textMuted, marginTop: 1 } }, 'OpenAI 兼容协议 · 密钥本地存储')
            )
          )
        ),
        h('div', { style: { padding: 20, display: 'flex', flexDirection: 'column', gap: 14 } },
          [
            { key: 'baseUrl', label: 'Base URL', placeholder: 'https://api.openai.com/v1', value: baseUrl, set: setBaseUrl, type: 'text' },
            { key: 'apiKey', label: 'API Key', placeholder: 'sk-...', value: apiKey, set: setApiKey, type: 'password' },
            { key: 'model', label: 'Model', placeholder: 'gpt-4o-mini', value: model, set: setModel, type: 'text' },
          ].map(f =>
            h('div', { key: f.key },
              h('div', { style: { fontSize: 11, color: T.textMuted, marginBottom: 6, fontWeight: 500, textTransform: 'uppercase', letterSpacing: 0.5 } }, f.label),
              h(Input, { type: f.type, value: f.value, placeholder: f.placeholder, onChange: e => f.set(e.target.value), style: { fontFamily: f.key !== 'model' ? 'JetBrains Mono, monospace' : 'inherit' } })
            )
          ),
          h('div', { style: { display: 'flex', gap: 8, marginTop: 4 } },
            h(Button, { onClick: () => setTestResult({ ok: true, msg: '已保存到本地数据库' }) },
              h(Lucide.Save, { size: 14 }), '保存配置'
            ),
            h(Button, { variant: 'outline', onClick: () => setTestResult({ ok: false, msg: '请先填入 API Key' }) },
              h(Lucide.Zap, { size: 14 }), '测试连接'
            )
          ),
          testResult && h('div', {
            style: {
              padding: '10px 14px', borderRadius: 8, fontSize: 12, marginTop: 4,
              background: testResult.ok ? T.successBg : `${T.danger}15`,
              color: testResult.ok ? T.success : T.danger,
              border: `1px solid ${testResult.ok ? T.success + '40' : T.danger + '40'}`,
              display: 'flex', alignItems: 'center', gap: 8,
            }
          },
            h(testResult.ok ? Lucide.CheckCircle : Lucide.XCircle, { size: 14 }),
            testResult.msg
          )
        )
      ),

      // 动作库
      h(Card, { padding: 0 },
        h('div', { style: { padding: '16px 20px', borderBottom: `1px solid ${T.border}` } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
            h('div', { style: {
              width: 32, height: 32, borderRadius: 8,
              background: `${T.success}15`, color: T.success,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
            } }, h(Lucide.Database, { size: 16 })),
            h('div', { style: { flex: 1 } },
              h('div', { style: { fontSize: 14, fontWeight: 600 } }, '动作库'),
              h('div', { style: { fontSize: 11, color: T.textMuted, marginTop: 1 } },
                exCount > 0 ? `已导入 ${exCount} 个核心动作` : '首次使用需要初始化'
              )
            ),
            exCount > 0 && h(Badge, { color: 'success' },
              h(Lucide.Check, { size: 10 }), '已就绪'
            )
          )
        ),
        h('div', { style: { padding: 20 } },
          h(Button, {
            onClick: () => { setExCount(50); setTestResult({ ok: true, msg: '已导入 50 个核心动作' }); }
          },
            h(Lucide.Download, { size: 14 }), '导入 50 个核心动作'
          )
        )
      ),

      // 关于
      h(Card, { padding: 20, style: { background: 'transparent', border: `1px solid ${T.border}` } },
        h('div', { style: { fontSize: 11, color: T.textDim, lineHeight: 1.8, textAlign: 'center' } },
          h('div', { style: { fontWeight: 500, color: T.textMuted, marginBottom: 4 } }, 'Agent Fitness v0.2.0'),
          h('div', null, '本地优先 · 数据存于 SQLite'),
          h('div', null, 'Tauri + React + TypeScript + SQLite')
        )
      )
    )
  );
}

// ============ App Shell ============
function App() {
  const { path } = useContext(RouterCtx);
  let page;
  if (path === '/log' || path === '/') page = h(LogPage);
  else if (path === '/plans') page = h(PlansPage);
  else if (path === '/progress') page = h(ProgressPage);
  else if (path === '/coach') page = h(CoachPage);
  else if (path === '/settings') page = h(SettingsPage);
  else page = h('div', { style: { padding: 40, textAlign: 'center', color: T.textMuted } }, '404');

  return h('div', { className: 'app-shell', style: { display: 'flex', height: '100vh', overflow: 'hidden' } },
    h(Sidebar),
    h('main', { style: { flex: 1, overflowY: 'auto', background: T.bg }, className: 'main' }, page)
  );
}

// 挂载
if (loadingEl) {
  loadingEl.style.opacity = '0';
  setTimeout(() => loadingEl.remove(), 300);
}
createRoot(document.getElementById('root')).render(h(Router, null, h(App)));

// 响应式 + bounce 动画
const style = document.createElement('style');
style.textContent = `
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
@media (max-width: 900px) {
  .sidebar { display: none !important; }
  .main { padding-bottom: 60px; }
  .page-content { padding: 16px !important; }
  .main-grid { grid-template-columns: 1fr !important; }
  .plan-grid { grid-template-columns: 1fr !important; }
  .coach-page .main { padding: 0; }
}
`;
document.head.appendChild(style);

} catch (e) {
  showError(e);
}
</script>
