function Router({ children }) {
  const [path, setPath] = useState(window.location.hash.slice(1) || '/log');

    const onHash = () => setPath(window.location.hash.slice(1) || '/log');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return h(RouterContext.Provider, { value: { path, setPath: (p) => { window.location.hash = p; } } }, children);
}
function Link({ to, className, children }) {
  const { setPath } = useContext(RouterContext);

// ============ 1RM 算法 ============
function estimateOneRm(weight, reps) {
  if (reps <= 0 || weight <= 0) return 0;
  if (reps === 1) return weight;
  const epley = weight * (1 + reps / 30);
  const brzycki = (weight * 36) / (37 - reps);
  const lombardi = weight * Math.pow(reps, 0.1);
  const mayhew = (100 * weight) / (52.2 + 41.9 * Math.exp(-0.055 * reps));
  const oconner = weight * (1 + 0.025 * reps);
  return (epley + brzycki + lombardi + mayhew + oconner) / 5;
}
function workingWeight(oneRm, pct) {
  return Math.round((oneRm * pct) / 2.5) * 2.5;
}

function PlansPage() {
  const [cfg, setCfg] = useState({ squat_tm: 140, bench_tm: 100, deadlift_tm: 180, ohp_tm: 60 });
  const [weeks, setWeeks] = useState(4);
  const [generated, setGenerated] = useState(null);
  const WEEK_SCHEMES = [
    [{ reps: 5, pct: 0.65 }, { reps: 5, pct: 0.75 }, { reps: 5, pct: 0.85, is_amrap: true }],
    [{ reps: 5, pct: 0.7 }, { reps: 3, pct: 0.8 }, { reps: 3, pct: 0.9, is_amrap: true }],
    [{ reps: 5, pct: 0.75 }, { reps: 3, pct: 0.85 }, { reps: 1, pct: 0.95, is_amrap: true }],
    [{ reps: 5, pct: 0.4 }, { reps: 5, pct: 0.5 }, { reps: 5, pct: 0.6 }],
  ];
  const LIFT_SCHEDULE = { 1: ['squat', 'bench'], 2: ['deadlift', 'ohp'], 3: ['squat', 'bench'], 4: ['deadlift', 'ohp'] };
  const LIFT_NAMES = { squat: '深蹲', bench: '卧推', deadlift: '硬拉', ohp: '推举' };
  const generate = () => {
    const tms = { squat: cfg.squat_tm, bench: cfg.bench_tm, deadlift: cfg.deadlift_tm, ohp: cfg.ohp_tm };
    const out = [];
    for (let w = 1; w <= weeks; w++) {
      const scheme = WEEK_SCHEMES[(w - 1) % 4];
      for (let d = 1; d <= 4; d++) {
        for (const lift of LIFT_SCHEDULE[d]) {
          const tm = tms[lift];
          for (let s = 0; s < scheme.length; s++) {
            const set = scheme[s];
            out.push({ week: w, day: d, lift, set_index: s + 1, reps: set.reps, weight: workingWeight(tm, set.pct), pct: set.pct, is_amrap: set.is_amrap });
          }
        }
      }
    }
    setGenerated(out);
  };
  return h('div', { className: 'p-4 md:p-6 max-w-6xl mx-auto' },
    h('h1', { className: 'text-xl md:text-2xl font-semibold mb-2' }, '训练计划生成器'),
    h('p', { className: 'text-sm text-slate-500 mb-6' }, '5/3/1 周期化模板 - 基于 Jim Wendler 方法'),
    h('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4 mb-6' },
      h(Card, null,
        h(CardHeader, null, h(CardTitle, { className: 'text-base' }, '训练最大重量 (TM)')),
        h(CardContent, { className: 'space-y-3' },
          ['squat_tm', 'bench_tm', 'deadlift_tm', 'ohp_tm'].map((key, i) =>
            h('div', { key },
              h(Label, null, ['深蹲', '卧推', '硬拉', '推举'][i] + ' TM (kg)'),
              h(Input, { type: 'number', step: '2.5', value: cfg[key], onChange: e => setCfg({ ...cfg, [key]: +e.target.value || 0 }) })
            )
          )
        )
      ),
      h(Card, null,
        h(CardHeader, null, h(CardTitle, { className: 'text-base' }, '周期设置')),
        h(CardContent, { className: 'space-y-3' },
          h('div', null, h(Label, null, '周数'), h(Input, { type: 'number', min: 1, max: 12, value: weeks, onChange: e => setWeeks(+e.target.value || 1) })),
          h('div', { className: 'flex flex-col gap-2 pt-2' },
            h(Button, { onClick: generate }, '生成计划'),
            generated && h(Button, { variant: 'outline', onClick: () => alert('已导出 (mock)') }, '📥 导出 JSON')
          )
        )
      ),
      h(Card, null,
        h(CardHeader, null, h(CardTitle, { className: 'text-base' }, '5/3/1 说明')),
        h(CardContent, { className: 'text-sm space-y-2 text-slate-600' },
          h('p', null, '· TM ≈ 真实 1RM 的 90%'),
          h('p', null, '· 周 1: 3x5 @ 65/75/85%'),
          h('p', null, '· 周 2: 3x3 @ 70/80/90%'),
          h('p', null, '· 周 3: 5/3/1 @ 75/85/95%'),
          h('p', null, '· 周 4: Deload 3x5 @ 40/50/60%')
        )
      )
    ),
    generated && h(Card, null,
      h(CardHeader, null, h(CardTitle, null, '计划预览')),
      h(CardContent, null,
        h('div', { className: 'overflow-x-auto' },
          h('table', { className: 'w-full text-sm' },
            h('thead', { className: 'border-b text-xs text-slate-500' },
              h('tr', null,
                ['周', '日', '动作', '组', '次数', '%TM', '重量'].map(t => h('th', { key: t, className: 'text-left p-2' }, t))
              )
            ),
            h('tbody', null,
              ...generated.map((s, i) =>
                h('tr', { key: i, className: 'border-b last:border-0' },
                  h('td', { className: 'p-2 font-medium' }, `W${s.week}`),
                  h('td', { className: 'p-2' }, `D${s.day}`),
                  h('td', { className: 'p-2' }, LIFT_NAMES[s.lift]),
                  h('td', { className: 'p-2' }, s.set_index),
                  h('td', { className: 'p-2' }, `${s.reps}${s.is_amrap ? '+' : ''}`),
                  h('td', { className: 'p-2' }, `${(s.pct * 100).toFixed(0)}%`),
                  h('td', { className: 'p-2 font-mono' }, s.weight)
                )
              )

  );
}

        h('div', { className: 'flex flex-wrap gap-2' },
          ...allExercises.map(name =>
            h('button', { key: name, onClick: () => setSelected(prev => prev.includes(name) ? prev.filter(x => x !== name) : [...prev, name].slice(-6)),
              className: cn('text-xs px-3 py-1.5 rounded-full border transition-colors', selected.includes(name) ? 'bg-green-600 text-white border-green-600' : 'border-slate-300 hover:bg-slate-100') },
              name
            )
          )
        )
      )
    ),
    h(Card, null,
      h(CardHeader, null, h(CardTitle, null, '1RM 趋势 (kg)')),
      h(CardContent, null,
        h(ResponsiveContainer, { width: '100%', height: 360 },
          h(LineChart, { data: PROGRESS_DATA },
            h(CartesianGrid, { strokeDasharray: '3 3', stroke: '#e2e8f0' }),
            h(XAxis, { dataKey: 'date', stroke: '#64748b', fontSize: 12 }),
            h(YAxis, { stroke: '#64748b', fontSize: 12 }),
            h(Tooltip, null),
            h(Legend, null),
            ...selected.map((name, i) =>
              h(Line, { key: name, type: 'monotone', dataKey: name, stroke: colors[i % colors.length], strokeWidth: 2, dot: { r: 3 }, connectNulls: true })
            )
          )
        )
      )
    )
  );
}

function CoachPage() {
  const [messages, setMessages] = useState([
    { role: 'assistant', content: '你好！我是你的 AI 健身教练。\n\n我看到你最近训练：\n· 2026-08-26: 5 个动作 18 个工作组\n· 主项 1RM 估算: 蹲 122 / 推 92 / 拉 150\n\n想聊点什么？', ts: Date.now() - 60000 },
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [messages, loading]);
  const send = () => {
    const text = input.trim();
    if (!text || loading) return;
    const userMsg = { role: 'user', content: text, ts: Date.now() };
    setMessages(prev => [...prev, userMsg]);
    setInput('');
    setLoading(true);
    setTimeout(() => {
      const replies = [
        '看你最近深蹲从 105 涨到 122，4 周 +17kg，速度不错。\n\n建议：\n1. 继续 5/3/1，下周期 TM 涨 5kg\n2. 每周最多 1 次接近极限的 AMRAP\n3. 深蹲日和硬拉日隔 48 小时',
        '这个速度挺猛，但 RPE 8.5 才 5 次。\n\n· 100kg 5x5 把 RPE 稳定在 7-8\n· 等 RPE 7 稳定 3 个训练日再加 2.5kg\n· 大概 2-3 周后再测\n\n过度训练比少练更亏。',
        '一周 4 练合理安排：\n\n周一: 深蹲 + 卧推\n周三: 硬拉 + 推举\n周五: 深蹲 + 卧推\n周日: 硬拉 + 推举（轻）'
      ];
      setMessages(prev => [...prev, { role: 'assistant', content: replies[Math.floor(Math.random() * replies.length)], ts: Date.now() }]);
      setLoading(false);
    }, 1000);
  };
  return h('div', { className: 'p-4 md:p-6 max-w-4xl mx-auto h-screen flex flex-col' },
    h('div', { className: 'mb-4' },
      h('h1', { className: 'text-xl md:text-2xl font-semibold' }, '🤖 AI 教练'),
      h('p', { className: 'text-sm text-slate-500 mt-1' }, '⚠️ 当前是 mock 模式，未调用真实 API')
    ),
    h('div', { className: 'flex-1 overflow-hidden flex flex-col gap-3' },
      h('div', { ref: scrollRef, className: 'flex-1 overflow-y-auto space-y-3 pr-2' },
        ...messages.map((m, i) =>
          h('div', { key: i, className: cn('flex gap-2', m.role === 'user' ? 'justify-end' : 'justify-start') },
            m.role === 'assistant' && h('div', { className: 'w-8 h-8 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0 text-green-600' }, '🤖'),
            h('div', { className: cn('max-w-[75%] rounded-lg px-4 py-2.5 text-sm whitespace-pre-wrap', m.role === 'user' ? 'bg-green-600 text-white' : 'bg-white border border-slate-200') }, m.content),
            m.role === 'user' && h('div', { className: 'w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center flex-shrink-0' }, '👤')
          )
        ),
        loading && h('div', { className: 'flex gap-2' },
          h('div', { className: 'w-8 h-8 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0 text-green-600' }, '🤖'),
          h('div', { className: 'bg-white border border-slate-200 rounded-lg px-4 py-2.5 text-sm text-slate-500' }, '思考中...')
        )
      ),
      h('div', { className: 'flex gap-2' },
        h(Input, { placeholder: '问点什么...', value: input, onChange: e => setInput(e.target.value), onKeyDown: e => { if (e.key === 'Enter') send(); }, disabled: loading }),
        h(Button, { onClick: send, disabled: loading || !input.trim() }, '发送')
      )
    )
  );
}

function SettingsPage() {
  const [baseUrl, setBaseUrl] = useState('https://api.openai.com/v1');
  const [apiKey, setApiKey] = useState('');
  const [model, setModel] = useState('gpt-4o-mini');
  const [exCount, setExCount] = useState(0);
  const [testResult, setTestResult] = useState(null);
  return h('div', { className: 'p-4 md:p-6 max-w-3xl mx-auto space-y-4' },
    h('h1', { className: 'text-xl md:text-2xl font-semibold mb-2' }, '设置'),
    h(Card, null,
      h(CardHeader, null, h(CardTitle, null, 'AI API 配置')),
      h(CardContent, { className: 'space-y-3' },
        h('p', { className: 'text-sm text-slate-500' }, '支持 OpenAI / DeepSeek / OpenRouter / 自部署 vLLM 等。'),
        h('div', null, h(Label, null, 'Base URL'), h(Input, { value: baseUrl, onChange: e => setBaseUrl(e.target.value) })),
        h('div', null, h(Label, null, 'API Key'), h(Input, { type: 'password', value: apiKey, onChange: e => setApiKey(e.target.value), placeholder: 'sk-...' })),
        h('div', null, h(Label, null, 'Model'), h(Input, { value: model, onChange: e => setModel(e.target.value) })),
        h('div', { className: 'flex gap-2' },
          h(Button, { onClick: () => setTestResult('✅ 已保存（mock）') }, '💾 保存'),
          h(Button, { variant: 'outline', onClick: () => setTestResult('❌ 请先填入 API Key') }, '测试连接')
        ),
        testResult && h('p', { className: 'text-sm bg-slate-100 p-2 rounded' }, testResult)
      )
    ),
    h(Card, null,
      h(CardHeader, null, h(CardTitle, null, '动作库')),
      h(CardContent, null,
        h('p', { className: 'text-sm text-slate-500 mb-3' }, `数据库中已有 ${exCount} 个动作。`),
        h(Button, { onClick: () => { setExCount(50); setTestResult('✅ 导入 50 个核心动作（mock）'); } }, '导入 50 个核心动作')
      )
    )
  );
}

// ============ App Shell ============
function App() {
  const { path } = useLocation();
  const navItems = [
    { to: '/log', label: '训练日志', icon: '🏋️' },
    { to: '/plans', label: '训练计划', icon: '📋' },
    { to: '/progress', label: '进度追踪', icon: '📈' },
    { to: '/coach', label: 'AI 教练', icon: '🤖' },
    { to: '/settings', label: '设置', icon: '⚙️' },
  ];
  let page;
  if (path === '/log' || path === '/') page = h(LogPage);
  else if (path === '/plans') page = h(PlansPage);
  else if (path === '/progress') page = h(ProgressPage);
  else if (path === '/coach') page = h(CoachPage);
  else if (path === '/settings') page = h(SettingsPage);
  else page = h('div', { className: 'p-6' }, '404 - 页面不存在');
  return h('div', { className: 'flex h-screen overflow-hidden bg-slate-50' },
    h('aside', { className: 'w-48 md:w-56 border-r border-slate-200 bg-white flex flex-col flex-shrink-0' },
      h('div', { className: 'px-4 py-4 border-b border-slate-200' },
        h('h1', { className: 'text-base font-semibold flex items-center gap-2' },
          h('span', { className: 'text-green-600' }, '🏋️'),
          'Agent Fitness'
        ),
        h('p', { className: 'text-xs text-slate-500 mt-1' }, 'Local-first AI coach')
      ),
      h('nav', { className: 'flex-1 p-2 space-y-1' },
        ...navItems.map(item =>
          h(Link, { key: item.to, to: item.to,
            className: cn('flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors',
              path === item.to ? 'bg-green-600 text-white' : 'hover:bg-slate-100 text-slate-700'
            ) },
            h('span', null, item.icon),
            item.label
          )
        )
      ),
      h('div', { className: 'p-3 border-t border-slate-200 text-xs text-slate-400' }, 'v0.1.0 · preview')
    ),
    h('main', { className: 'flex-1 overflow-auto' }, page)
  );
}

// 挂载
loadingEl.style.opacity = '0';
setTimeout(() => loadingEl.remove(), 300);
createRoot(document.getElementById('root')).render(h(Router, null, h(App)));

} catch (e) {
  showError(e);
}
</script>
</body>
</html>
